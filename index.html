<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Stranger</title>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; }
        #root { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [gameActive, setGameActive] = useState(false);
            const [menuState, setMenuState] = useState('start'); 
            const [score, setScore] = useState(0);
            const [difficulty, setDifficulty] = useState('HAWKINS'); 
            const [vessel, setVessel] = useState('STEVE');
            const [speedLevel, setSpeedLevel] = useState(1);
            
            const canvasRef = useRef(null);
            const gameLoopRef = useRef(null);

            const state = useRef({
                player: { y: 300, v: 0 },
                pipes: [],
                startTime: 0,
                currentSpeed: 2.6,
                config: { gravity: 0.22, flap: -4.8, gap: 185 } 
            });

            const update = () => {
                if (!gameActive) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const s = state.current;
                
                if (difficulty === 'UPSIDE-DOWN') {
                    const elapsedSeconds = (Date.now() - s.startTime) / 1000;
                    const level = Math.floor(elapsedSeconds / 10) + 1;
                    if (level !== speedLevel) setSpeedLevel(level);
                    s.currentSpeed = 3.0 + ((level - 1) * 0.4); 
                } else {
                    s.currentSpeed = 2.7; 
                }

                s.player.v += s.config.gravity;
                s.player.y += s.player.v;

                if (s.player.y > canvas.height || s.player.y < 0) return endGame();

                const lastPipe = s.pipes[s.pipes.length - 1];
                if (!lastPipe || (canvas.width - lastPipe.x) >= 260) {
                    const t = Math.random() * (canvas.height - s.config.gap - 200) + 100;
                    s.pipes.push({ x: canvas.width, t, pass: false });
                }

                s.pipes.forEach((p, i) => {
                    p.x -= s.currentSpeed;
                    if (70 + 10 > p.x && 70 - 10 < p.x + 50) {
                        if (s.player.y - 10 < p.t || s.player.y + 10 > p.t + s.config.gap) endGame();
                    }
                    if (!p.pass && p.x < 70) { p.pass = true; setScore(v => v + 1); }
                    if (p.x < -100) s.pipes.splice(i, 1);
                });
            };

            const draw = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const s = state.current;

                ctx.fillStyle = (difficulty === 'UPSIDE-DOWN') ? '#020208' : '#080000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.font = "900 68px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.lineWidth = 3;
                ctx.strokeStyle = difficulty === 'UPSIDE-DOWN' ? 'rgba(0,180,255,0.08)' : 'rgba(255,0,0,0.08)';
                ctx.strokeText("FLAPPY", canvas.width/2, canvas.height/2 - 40);
                ctx.strokeText("STRANGER", canvas.width/2, canvas.height/2 + 40);
                ctx.restore();

                s.pipes.forEach(p => {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(p.x, 0, 50, p.t);
                    ctx.fillRect(p.x, p.t + s.config.gap, 50, canvas.height);
                    ctx.strokeStyle = difficulty === 'UPSIDE-DOWN' ? '#00e5ff' : '#ff1111';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(p.x, 0, 50, p.t);
                    ctx.strokeRect(p.x, p.t + s.config.gap, 50, canvas.height);
                });

                ctx.save();
                ctx.translate(70, s.player.y);
                ctx.rotate(s.player.v * 0.12);
                if (vessel === 'STEVE') {
                    ctx.fillStyle = '#6b3e23'; ctx.beginPath(); ctx.roundRect(-6, -18, 12, 36, 2); ctx.fill();
                    ctx.fillStyle = '#ccc'; ctx.fillRect(-7, -12, 14, 2); ctx.fillRect(-7, 4, 14, 2); 
                } else {
                    ctx.font = "34px sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(vessel === 'ELEVEN' ? '🧇' : '🕰️', 0, 0);
                }
                ctx.restore();
            };

            const handleInput = (e) => {
                if (e) e.preventDefault();
                if (gameActive) {
                    state.current.player.v = state.current.config.flap;
                }
            };

            const resetGame = () => {
                const canvas = canvasRef.current;
                state.current.player = { y: canvas.height / 2, v: 0 };
                state.current.pipes = [];
                state.current.startTime = Date.now();
                setSpeedLevel(1);
                state.current.config = difficulty === 'HAWKINS' ? 
                    { gravity: 0.22, flap: -4.8, gap: 190 } : 
                    { gravity: 0.28, flap: -5.4, gap: 175 };
                setScore(0);
                setGameActive(true);
                setMenuState('playing');
            };

            const endGame = () => {
                setGameActive(false);
                setMenuState('gameOver');
            };

            useEffect(() => {
                const loop = () => { update(); draw(); gameLoopRef.current = requestAnimationFrame(loop); };
                gameLoopRef.current = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(gameLoopRef.current);
            }, [gameActive, score, difficulty, vessel]);

            return (
                <div className="fixed inset-0 flex items-center justify-center bg-[#030303] text-white overflow-hidden">
                    <div className="relative aspect-[9/16] h-full max-h-screen bg-black overflow-hidden border-x border-zinc-900">
                        <canvas ref={canvasRef} width={360} height={640} className="w-full h-full cursor-pointer" onMouseDown={handleInput} onTouchStart={handleInput} />
                        {menuState === 'playing' && (
                            <div className="absolute top-14 inset-x-0 flex flex-col items-center pointer-events-none">
                                <span className="text-7xl font-black text-white italic tracking-tighter">{score}</span>
                            </div>
                        )}
                        {menuState !== 'playing' && (
                            <div className="absolute inset-0 bg-black/95 flex flex-col items-center justify-center p-8 text-center">
                                {menuState === 'start' ? (
                                    <div className="w-full space-y-8">
                                        <h1 className="text-6xl font-black text-red-700 italic">FLAPPY STRANGER</h1>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={() => setDifficulty('HAWKINS')} className={`py-4 text-[10px] border ${difficulty === 'HAWKINS' ? 'border-red-600 text-red-500' : 'border-zinc-800 text-zinc-600'}`}>HAWKINS</button>
                                            <button onClick={() => setDifficulty('UPSIDE-DOWN')} className={`py-4 text-[10px] border ${difficulty === 'UPSIDE-DOWN' ? 'border-cyan-600 text-cyan-500' : 'border-zinc-800 text-zinc-600'}`}>UPSIDE-DOWN</button>
                                        </div>
                                        <div className="flex justify-around items-center h-20">
                                            <button onClick={() => setVessel('ELEVEN')} className={vessel === 'ELEVEN' ? 'scale-125' : 'opacity-20'}>🧇</button>
                                            <button onClick={() => setVessel('STEVE')} className={vessel === 'STEVE' ? 'scale-125' : 'opacity-20'}>🏏</button>
                                        </div>
                                        <button onClick={resetGame} className="w-full py-5 bg-red-700 font-black text-2xl uppercase italic">Play Game</button>
                                    </div>
                                ) : (
                                    <div className="w-full space-y-8">
                                        <h2 className="text-3xl font-black text-red-600">GAME OVER</h2>
                                        <h3 className="text-8xl font-black italic">{score}</h3>
                                        <button onClick={resetGame} className="w-full py-5 bg-red-700 font-black text-xl uppercase italic">Try Again</button>
                                        <button onClick={() => setMenuState('start')} className="w-full py-4 border border-zinc-800 text-zinc-500 uppercase">Menu</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
