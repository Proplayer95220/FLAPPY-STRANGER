<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flappy Stranger Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
        .no-select { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body class="no-select">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [gameActive, setGameActive] = useState(false);
            const [menuState, setMenuState] = useState('start'); 
            const [score, setScore] = useState(0);
            const [difficulty, setDifficulty] = useState('HAWKINS'); 
            const [vessel, setVessel] = useState('ELEVEN');
            const [isSlowModeEnabled, setIsSlowModeEnabled] = useState(false);
            const [speedLevel, setSpeedLevel] = useState(1);
            const [highScores, setHighScores] = useState({ HAWKINS: 0, 'UPSIDE-DOWN': 0 });
            
            const canvasRef = useRef(null);
            const gameLoopRef = useRef(null);

            const state = useRef({
                player: { y: 300, v: 0 },
                pipes: [],
                startTime: 0,
                currentSpeed: 2.6,
                slowTimer: 0,
                config: { gravity: 0.22, flap: -4.8, gap: 185 } 
            });

            useEffect(() => {
                const saved = localStorage.getItem('fs_v4_scores');
                if (saved) setHighScores(JSON.parse(saved));
            }, []);

            const update = () => {
                if (!gameActive) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const s = state.current;
                
                const tScale = (isSlowModeEnabled && s.slowTimer > 0) ? 0.45 : 1.0;
                if (s.slowTimer > 0) s.slowTimer--;

                if (difficulty === 'UPSIDE-DOWN') {
                    const elapsedSeconds = (Date.now() - s.startTime) / 1000;
                    const level = Math.floor(elapsedSeconds / 10) + 1;
                    if (level !== speedLevel) setSpeedLevel(level);
                    s.currentSpeed = 3.2 + ((level - 1) * 0.45); 
                } else {
                    s.currentSpeed = 2.8; 
                    if (speedLevel !== 1) setSpeedLevel(1);
                }

                s.player.v += s.config.gravity * tScale;
                s.player.y += s.player.v * tScale;

                if (s.player.y > canvas.height || s.player.y < 0) return endGame();

                const lastPipe = s.pipes[s.pipes.length - 1];
                if (!lastPipe || (canvas.width - lastPipe.x) >= 250) {
                    const t = Math.random() * (canvas.height - s.config.gap - 220) + 110;
                    s.pipes.push({ x: canvas.width, t, pass: false });
                }

                s.pipes.forEach((p, i) => {
                    p.x -= s.currentSpeed * tScale;
                    if (70 + 12 > p.x && 70 - 12 < p.x + 50) {
                        if (s.player.y - 12 < p.t || s.player.y + 12 > p.t + s.config.gap) endGame();
                    }
                    if (!p.pass && p.x < 70) { p.pass = true; setScore(v => v + 1); }
                    if (p.x < -100) s.pipes.splice(i, 1);
                });
            };

            const draw = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const s = state.current;

                ctx.fillStyle = (difficulty === 'UPSIDE-DOWN') ? '#020205' : '#050000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // DARKER BACKGROUND LOGO - SPLIT INTO TWO LINES
                ctx.save();
                ctx.font = "900 64px Inter";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.lineWidth = 1.5;
                
                // Darker color logic: Upside-Down = Deep Red, Hawkins = Deep Blue
                const strokeColor = difficulty === 'UPSIDE-DOWN' 
                    ? 'rgba(150, 0, 0, 0.12)' 
                    : 'rgba(0, 70, 150, 0.12)';
                
                ctx.strokeStyle = strokeColor;
                ctx.strokeText("FLAPPY", canvas.width/2, canvas.height/2 - 35);
                ctx.strokeText("STRANGER", canvas.width/2, canvas.height/2 + 35);
                ctx.restore();

                s.pipes.forEach(p => {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(p.x, 0, 50, p.t);
                    ctx.fillRect(p.x, p.t + s.config.gap, 50, canvas.height);
                    ctx.strokeStyle = difficulty === 'UPSIDE-DOWN' ? '#00e5ff' : '#ff1111';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(p.x, 0, 50, p.t);
                    ctx.strokeRect(p.x, p.t + s.config.gap, 50, canvas.height);
                });

                ctx.save();
                ctx.translate(70, s.player.y);
                ctx.rotate(s.player.v * 0.12);
                ctx.font = "38px serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const icons = { 'ELEVEN': '🧇', 'STEVE': '🏏', 'VECNA': '🕰️' };
                ctx.fillText(icons[vessel], 0, 0);
                ctx.restore();
            };

            const handleInput = (e) => {
                if (e) e.preventDefault();
                if (gameActive) {
                    state.current.player.v = state.current.config.flap;
                    if (isSlowModeEnabled) state.current.slowTimer = 22; 
                }
            };

            const resetGame = () => {
                const canvas = canvasRef.current;
                state.current.player = { y: canvas.height / 2, v: 0 };
                state.current.pipes = [];
                state.current.startTime = Date.now();
                setSpeedLevel(1);
                state.current.config = difficulty === 'HAWKINS' ? 
                    { gravity: 0.24, flap: -5.0, gap: 190 } : 
                    { gravity: 0.30, flap: -5.6, gap: 175 };
                setScore(0);
                setGameActive(true);
                setMenuState('playing');
            };

            const endGame = () => {
                setGameActive(false);
                setMenuState('gameOver');
                if (!isSlowModeEnabled && score > highScores[difficulty]) {
                    const newScores = { ...highScores, [difficulty]: score };
                    setHighScores(newScores);
                    localStorage.setItem('fs_v4_scores', JSON.stringify(newScores));
                }
            };

            useEffect(() => {
                const loop = () => { update(); draw(); gameLoopRef.current = requestAnimationFrame(loop); };
                gameLoopRef.current = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(gameLoopRef.current);
            }, [gameActive, score, isSlowModeEnabled, difficulty, vessel]);

            return (
                <div className="fixed inset-0 flex items-center justify-center bg-[#030303] text-white touch-none select-none overflow-hidden">
                    <div className="relative aspect-[9/16] h-full max-h-screen bg-black overflow-hidden border-x border-zinc-900 shadow-2xl">
                        <canvas ref={canvasRef} width={360} height={640} className="w-full h-full cursor-pointer" onMouseDown={handleInput} onTouchStart={handleInput} />

                        {menuState === 'playing' && (
                            <div className="absolute top-14 inset-x-0 flex flex-col items-center pointer-events-none">
                                <span className="text-7xl font-black italic tracking-tighter text-white drop-shadow-lg">{score}</span>
                                <div className="flex gap-2 mt-1 bg-black/40 px-3 py-1 backdrop-blur-sm border border-white/5">
                                    <span className="text-[9px] font-black tracking-widest uppercase text-zinc-400">{difficulty}</span>
                                    {difficulty === 'UPSIDE-DOWN' && <span className="text-[9px] text-cyan-400 font-black uppercase">LVL {speedLevel}</span>}
                                    {isSlowModeEnabled && <span className="text-[9px] text-yellow-500 font-black uppercase">Practice</span>}
                                </div>
                            </div>
                        )}

                        {menuState !== 'playing' && (
                            <div className="absolute inset-0 bg-black/95 flex flex-col items-center justify-center p-8 text-center backdrop-blur-md">
                                {menuState === 'start' ? (
                                    <div className="w-full space-y-6">
                                        <div className="space-y-0">
                                            <h1 className="text-6xl font-black text-red-700 italic tracking-tighter drop-shadow-xl">FLAPPY</h1>
                                            <h1 className="text-2xl font-black text-white tracking-[.3em] opacity-80 -mt-2 uppercase">Stranger</h1>
                                        </div>

                                        <div className="space-y-4">
                                            <div className="grid grid-cols-2 gap-2">
                                                <button onClick={() => setDifficulty('HAWKINS')} className={`py-4 text-[10px] font-black border-2 transition-all ${difficulty === 'HAWKINS' ? 'border-red-600 text-red-500 bg-red-600/5' : 'border-zinc-800 text-zinc-600'}`}>HAWKINS</button>
                                                <button onClick={() => setDifficulty('UPSIDE-DOWN')} className={`py-4 text-[10px] font-black border-2 transition-all ${difficulty === 'UPSIDE-DOWN' ? 'border-cyan-600 text-cyan-500 bg-cyan-600/5' : 'border-zinc-800 text-zinc-600'}`}>UPSIDE-DOWN</button>
                                            </div>

                                            <div className="bg-zinc-900/40 p-3 border border-zinc-800 flex justify-between items-center px-4">
                                                <span className="text-[10px] text-zinc-500 font-black uppercase tracking-widest">{difficulty} Best</span>
                                                <span className="text-2xl font-black italic text-white tracking-tighter">{highScores[difficulty]}</span>
                                            </div>

                                            <div className="bg-zinc-900/40 p-4 border border-zinc-800 space-y-3">
                                                <div className="flex justify-between items-center">
                                                    <div className="text-left">
                                                        <p className="text-[11px] font-black text-white tracking-widest uppercase italic">Psychic Burst</p>
                                                        <p className="text-[8px] text-zinc-500 font-bold uppercase tracking-wider">No Record Saved</p>
                                                    </div>
                                                    <button onClick={() => setIsSlowModeEnabled(!isSlowModeEnabled)} className={`w-12 h-6 border-2 transition-colors relative ${isSlowModeEnabled ? 'bg-cyan-600 border-cyan-400' : 'bg-zinc-800 border-zinc-700'}`}>
                                                        <div className={`absolute top-0.5 bottom-0.5 w-4.5 bg-white transition-all ${isSlowModeEnabled ? 'right-0.5' : 'left-0.5'}`} />
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="flex justify-around items-center h-24">
                                                <button onClick={() => setVessel('ELEVEN')} className={`flex flex-col items-center gap-2 transition-all ${vessel === 'ELEVEN' ? 'scale-125 opacity-100' : 'opacity-20 grayscale'}`}>
                                                    <span className="text-4xl leading-none">🧇</span>
                                                    <span className="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Eleven</span>
                                                </button>
                                                <button onClick={() => setVessel('STEVE')} className={`flex flex-col items-center gap-2 transition-all ${vessel === 'STEVE' ? 'scale-125 opacity-100' : 'opacity-20 grayscale'}`}>
                                                    <span className="text-4xl leading-none">🏏</span>
                                                    <span className="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Steve</span>
                                                </button>
                                                <button onClick={() => setVessel('VECNA')} className={`flex flex-col items-center gap-2 transition-all ${vessel === 'VECNA' ? 'scale-125 opacity-100' : 'opacity-20 grayscale'}`}>
                                                    <span className="text-4xl leading-none">🕰️</span>
                                                    <span className="text-[8px] font-black text-zinc-600 uppercase tracking-widest">Vecna</span>
                                                </button>
                                            </div>
                                        </div>

                                        <button onClick={resetGame} className="w-full py-5 bg-red-700 font-black text-2xl tracking-tight active:scale-95 transition-all shadow-xl uppercase italic">Enter Rift</button>
                                    </div>
                                ) : (
                                    <div className="w-full space-y-8 animate-in fade-in zoom-in-95 duration-300">
                                        <div className="space-y-2">
                                            <h2 className="text-3xl font-black italic text-red-600 tracking-tighter uppercase">Rift Closed</h2>
                                            <div className="bg-zinc-900/40 border border-zinc-800 py-10">
                                                <p className="text-zinc-500 text-[10px] font-black uppercase mb-2 tracking-widest">Final Score</p>
                                                <h3 className="text-8xl font-black italic tracking-tighter">{score}</h3>
                                                {isSlowModeEnabled ? (
                                                    <p className="text-yellow-500/60 text-[9px] font-black uppercase mt-2">Practice Session</p>
                                                ) : score >= highScores[difficulty] && score > 0 ? (
                                                    <p className="text-cyan-400 text-[10px] font-black uppercase mt-2 tracking-widest animate-pulse">New Personal Best!</p>
                                                ) : null}
                                            </div>
                                        </div>
                                        <div className="space-y-3">
                                            <button onClick={resetGame} className="w-full py-5 bg-red-700 font-black text-xl hover:bg-red-600 transition-all uppercase italic">Retry</button>
                                            <button onClick={() => setMenuState('start')} className="w-full py-4 border border-zinc-800 text-zinc-500 text-[10px] font-black tracking-widest uppercase">Main Menu</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
